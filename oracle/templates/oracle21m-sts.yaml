apiVersion: v1
kind: Service
metadata:
  name: oracle21m
  labels:
    oracle: oracle21m
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle21m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-21m
  labels:
    oracle: oracle21m
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle21m
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle21m
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle21m
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 54321
        fsGroup: 54321
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle21m
        imagePullPolicy: {{ .Values.pullPolicy }}
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle21m.image.repository }}:{{ .Values.oracle21m.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle21m.resources | nindent 10 }}
        volumeMounts:
        {{- /* TODO no entry point yet: add create-21m.sql and run-21m.sql, and mount the latter from oracle-run, see oracle12m-sts.yaml */}}
        - mountPath: {{ .Values.scriptsLibPath }}
          name: oracle-scripts
      hostname: oracle21m
      volumes:
      {{- include "oracle.scriptsVolume" . | nindent 6 }}
