{{ include "oracle.pvc" (dict "root" . "version" "23m") }}
---
apiVersion: v1
kind: Service
metadata:
  name: oracle23m
  labels:
    oracle: oracle23m
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle23m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-23m
  labels:
    oracle: oracle23m
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle23m
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle23m
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle23m
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 54321
        fsGroup: 54321
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
      {{- include "oracle.pvcInitContainer" (dict "root" . "version" "23m") | nindent 6 }}
      containers:
      - name: oracle23m
        imagePullPolicy: {{ .Values.pullPolicy }}
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle23m.image.repository }}:{{ .Values.oracle23m.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle23m.resources | nindent 10 }}
        volumeMounts:
        {{- /* TODO no entry point yet: add create-23m.sql and run-23m.sql, and mount the latter from oracle-run, see oracle12m-sts.yaml */}}
        - mountPath: {{ .Values.scriptsLibPath }}
          name: oracle-scripts
        {{- include "oracle.pvcVolumeMount" (dict "root" . "version" "23m") | nindent 8 }}
      hostname: oracle23m
      volumes:
      {{- include "oracle.scriptsVolume" . | nindent 6 }}
      {{- include "oracle.pvcVolume" (dict "root" . "version" "23m") | nindent 6 }}
