apiVersion: v1
kind: Service
metadata:
  name: oracle23m
  labels:
    oracle: oracle23m
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle23m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-23m
  labels:
    oracle: oracle23m
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle23m
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle23m
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle23m
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle23m
        imagePullPolicy: {{ .Values.pullPolicy }}
        securityContext:
            runAsNonRoot: true
            runAsUser: 1000
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle23m.image.repository }}:{{ .Values.oracle23m.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle23m.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsMountPath.default }}
          name: oracle-scripts
      hostname: oracle23m
      volumes:
      - configMap:
            name: oracle-scripts
        name: oracle-scripts
