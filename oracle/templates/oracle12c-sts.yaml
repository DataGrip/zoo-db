apiVersion: v1
kind: Service
metadata:
  name: oracle12c
  labels:
    oracle: oracle12c
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle12c
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-12c
  labels:
    oracle: oracle12c
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle12c
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle12c
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle12c
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 54321
        fsGroup: 54321
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle12c
        imagePullPolicy: {{ .Values.pullPolicy }}
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle12c.image.repository }}:{{ .Values.oracle12c.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle12c.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsMountPath.default }}
          name: oracle-scripts
      hostname: oracle12c
      volumes:
      - configMap:
            name: oracle-scripts
        name: oracle-scripts
