apiVersion: v1
kind: Service
metadata:
  name: oracle19c
  labels:
    oracle: oracle19c
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle19c
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-19c
  labels:
    oracle: oracle19c
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle19c
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle19c
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle19c
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 54321
        fsGroup: 54321
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle19c
        imagePullPolicy: {{ .Values.pullPolicy }}
        env:
           - name: ORACLE_PWD
             valueFrom:
               secretKeyRef:
                 key: password
                 name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle19c.image.repository }}:{{ .Values.oracle19c.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle19c.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsMountPath.default }}
          name: oracle-scripts
      hostname: oracle19c
      volumes:
      - configMap:
           name: oracle-scripts
        name: oracle-scripts
