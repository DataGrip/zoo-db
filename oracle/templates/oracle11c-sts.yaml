apiVersion: v1
kind: Service
metadata:
  name: oracle11c
  labels:
    oracle: oracle11c
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle11c
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-11c
  labels:
    oracle: oracle11c
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle11c
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle11c
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle11c
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle11c
        imagePullPolicy: {{ .Values.pullPolicy }}
        image: {{ .Values.oracle11c.image.repository }}:{{ .Values.oracle11c.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle11c.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsMountPath.oracle11c }}
          name: oracle-scripts
      hostname: oracle11c
      volumes:
      - configMap:
            name: oracle-scripts
        name: oracle-scripts
