apiVersion: v1
kind: Service
metadata:
  name: oracle19s
  labels:
    oracle: oracle19s
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle19s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-19s
  labels:
    oracle: oracle19s
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle19s
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle19s
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle19s
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle19s
        imagePullPolicy: {{ .Values.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        env:
           - name: ORACLE_PWD
             valueFrom:
               secretKeyRef:
                 key: password
                 name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle19s.image.repository }}:{{ .Values.oracle19s.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle19s.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsMountPath.default }}
          name: oracle-scripts
      hostname: oracle19s
      volumes:
      - configMap:
           name: oracle-scripts
        name: oracle-scripts
