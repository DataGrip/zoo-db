{{ include "oracle.pvc" (dict "root" . "version" "12m") }}
---
apiVersion: v1
kind: Service
metadata:
  name: oracle12m
  labels:
    oracle: oracle12m
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle12m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-12m
  labels:
    oracle: oracle12m
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle12m
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle12m
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle12m
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 54321
        runAsGroup: 54321
        fsGroup: 54321
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
      {{- include "oracle.pvcInitContainer" (dict "root" . "version" "12m") | nindent 6 }}
      containers:
      - name: oracle12m
        imagePullPolicy: {{ .Values.pullPolicy }}
        securityContext:
            runAsGroup: 54321
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "oracle.fullname" . }}-sys-password
        # SQL*Plus looks for the scripts included with a relative path (like '@@Sys/x.sql')
        # in the current directory and then here, not next to the calling script.
        - name: SQLPATH
          value: {{ .Values.scriptsLibPath | quote }}
        image: {{ .Values.oracle12m.image.repository }}:{{ .Values.oracle12m.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle12m.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsLibPath }}
          name: oracle-scripts
        - mountPath: {{ .Values.scriptsMountPath.default }}/run-12m.sql
          name: oracle-run
          subPath: run-12m.sql
        {{- include "oracle.pvcVolumeMount" (dict "root" . "version" "12m") | nindent 8 }}
      hostname: oracle12m
      volumes:
      {{- include "oracle.scriptsVolume" . | nindent 6 }}
      - configMap:
            name: oracle-run
        name: oracle-run
      {{- include "oracle.pvcVolume" (dict "root" . "version" "12m") | nindent 6 }}
