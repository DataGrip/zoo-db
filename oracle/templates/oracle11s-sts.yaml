apiVersion: v1
kind: Service
metadata:
  name: oracle11s
  labels:
    oracle: oracle11s
spec:
  ports:
    - port: 1521
      name: oracle
  {{/*clusterIP: None*/}}
  publishNotReadyAddresses: true
  selector:
    oracle: oracle11s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle.name" . }}-11s
  labels:
    oracle: oracle11s
  {{- include "oracle.labels" . | nindent 4 }}
spec:
  serviceName: oracle11s
  replicas: 1
  selector:
    matchLabels:
      oracle: oracle11s
    {{- include "oracle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        oracle: oracle11s
      {{- include "oracle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      setHostnameAsFQDN: true
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: oracle11s
        imagePullPolicy: {{ .Values.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: password
              name: {{ include "oracle.fullname" . }}-sys-password
        image: {{ .Values.oracle11s.image.repository }}:{{ .Values.oracle11s.image.tag | default
          .Chart.AppVersion }}
        ports:
        - containerPort: 1521
          protocol: TCP
        resources: {{- toYaml .Values.oracle11s.resources | nindent 10 }}
        volumeMounts:
        - mountPath: {{ .Values.scriptsMountPath.oracle11s }}
          name: oracle-scripts
      hostname: oracle11s
      volumes:
      - configMap:
            name: oracle-scripts
        name: oracle-scripts
