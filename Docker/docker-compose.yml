services:

# ----------- MS SQL ---------------

    ms14:
        container_name: ms14
        hostname: ms14
        image: registry.jetbrains.team/p/datagrip/containers/mssql-custom:14
#        privileged: true
        ports:
            - "25140:1433"
        volumes:
            - "../mssql/scripts:/scripts"
        env_file:
            - .mssql.env
        deploy:
            resources:
                limits:
                    memory: 4G
                reservations:
                    memory: 2G
        healthcheck:
            test: grep "Starting up database 'master'." /var/opt/mssql/log/errorlog || exit 1
            interval: 10s
            timeout: 10s
            retries: 15

    ms15:
        container_name: ms15
        hostname: ms15
        image: registry.jetbrains.team/p/datagrip/containers/mssql-custom:15
        #privileged: true
        ports:
            - "25150:1433"
        volumes:
            - "../mssql/scripts:/scripts"
        env_file:
            - .mssql.env
        deploy:
            resources:
                limits:
                    memory: 4G
                reservations:
                    memory: 2G
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -t 1 || exit 1"]
            interval: 10s
            timeout: 10s
            retries: 15

    ms16:
        container_name: ms16
        hostname: ms16
        image: registry.jetbrains.team/p/datagrip/containers/mssql-custom:16
        # privileged: true
        ports:
            - "25160:1433"
        volumes:
            - "../mssql/scripts:/scripts"
        env_file:
            - .mssql.env
        deploy:
            resources:
                limits:
                    memory: 4G
                reservations:
                    memory: 2G
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -t 1 || exit 1"]
            interval: 10s
            timeout: 10s
            retries: 15

# ----------- Oracle ---------------

    oracle-11.2-noncdb:
        container_name: oracle-11.2-noncdb
        hostname: oracle-11.2-noncdb
        image: registry.jetbrains.team/p/datagrip/containers/oracle:11.2.0.2-xe-orig
        ports:
            - "25110:1521"
        shm_size: 1g
        env_file: .oracle.env
        #volumes:
        #    - "../oracle/scripts:/u01/app/oracle/scripts/setup"
        healthcheck:
            test: ["CMD-SHELL", "/u01/app/oracle/checkDBStatus.sh"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m


    oracle-12.2-noncdb:
        container_name: oracle-12.2-noncdb
        image: registry.jetbrains.team/p/datagrip/containers/oracle-custom:12.2.0.2-noncdb
        hostname: oracle-12.2-noncdb
        env_file: .oracle.env
        ports:
            - "25111:1521"
        shm_size: 1g
        #volumes:
        #    - "../oracle/scripts:/opt/oracle/scripts/setup"
        healthcheck:
            test: ["CMD-SHELL", "sqlplus -L sys/$$ORACLE_PWD@//localhost:1521/$$ORACLE_SID as sysdba <<< \"select 1 from dual;\" || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m


    oracle-12.2-multi:
        image: registry.jetbrains.team/p/datagrip/containers/oracle:12.2.0.1-e-orig
        hostname: oracle-12.2-multi
        container_name: oracle-12.2-multi
        env_file: .oracle.env
        ports:
            - "25112:1521"
        shm_size: 1g
        #volumes:
        #    - "../oracle/scripts:/opt/oracle/scripts/setup"
        healthcheck:
            test: ["CMD-SHELL", "echo 'show pdbs' | sqlplus -S -L / as sysdba | grep -q 'READ WRITE' || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m


    oracle-19.3-noncdb:
        image: registry.jetbrains.team/p/datagrip/containers/oracle-custom:19.3-noncdb
        hostname: oracle-19.3-noncdb
        container_name: oracle_19.3_noncdb
        env_file: .oracle.env
        ports:
            - "25113:1521"
        shm_size: 1g
        #volumes:
        #    - "../oracle/scripts:/opt/oracle/scripts/setup"
        healthcheck:
            test: ["CMD-SHELL", "sqlplus -L sys/$$ORACLE_PWD@//localhost:1521/$$ORACLE_SID as sysdba <<< 'select 1 from dual;' || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m


    oracle-19.3-multi:
        image: registry.jetbrains.team/p/datagrip/containers/oracle-custom:19.3-multi
        hostname: oracle-19.3-multi
        container_name: oracle-19.3-multi
        env_file: .oracle.env
        ports:
            - "25114:1521"
        shm_size: 1g
        #volumes:
        #    - "../oracle/scripts:/opt/oracle/scripts/setup"
        healthcheck:
            test: grep "Database creation complete" /opt/oracle/cfgtoollogs/dbca/ORCLCDB/ORCLCDB.log || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m


    oracle-21.3-multi:
        image: registry.jetbrains.team/p/datagrip/containers/oracle-custom:21.3-multi
        hostname: oracle-21.3-multi
        container_name: oracle-21.3-multi
        env_file: .oracle.env
        ports:
            - "25115:1521"
        shm_size: 1g
        #volumes:
        #    - "../oracle/scripts:/opt/oracle/scripts/setup"
        healthcheck:
            test: grep "Database creation complete" /opt/oracle/cfgtoollogs/dbca/XE/XE.log || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m


    oracle-23.26-multi:
        image: registry.jetbrains.team/p/datagrip/containers/oracle-custom:23.26-multi
        hostname: oracle-23.26-multi
        container_name: oracle_23.26_multi
        env_file: .oracle.env
        ports:
            - "25116:1521"
        shm_size: 1g
        #volumes:
        #    - "../oracle/scripts:/opt/oracle/scripts/setup"
        healthcheck:
            test: grep "Database creation complete" /opt/oracle/cfgtoollogs/dbca/FREE/FREE.log || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 5m

